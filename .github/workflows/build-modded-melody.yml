name: Build Modded Melody

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  APK_INPUT: original/original-melody.apk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Apktool
        run: |
          curl -L --fail --retry 3 -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.1/apktool_3.0.1.jar

      - name: Check original APK
        run: test -f "$APK_INPUT"

      - name: Decode original Melody
        run: java -jar apktool.jar d -f "$APK_INPUT" -o melody-decoded

      - name: Inventory Melody UI and service entry points
        run: |
          {
            echo "=== Manifest components ==="
            grep -nE "activity|service|provider|receiver" melody-decoded/AndroidManifest.xml || true
            echo
            echo "=== Earphone-related classes and resources ==="
            grep -RIlE "EarphoneControlProvider|BatteryProvider|BluetoothService|BtDevice|earphone|headphone|device_detail|noise_reduction" \
              melody-decoded/smali* melody-decoded/res 2>/dev/null | sort | head -300 || true
            echo
            echo "=== Candidate Activity/Fragment declarations ==="
            grep -RInE "extends (L?android/app/Activity;|L?androidx/fragment/app/Fragment;|L?android/app/Fragment;)" \
              melody-decoded/smali* 2>/dev/null | head -300 || true
          } | tee melody-analysis.txt

      - name: Verify native injection points
        run: |
          grep -R "EarphoneControlProvider\|BatteryProvider\|BluetoothService" melody-decoded/smali* | head -50 || true

      - name: Apply Bose patch
        run: |
          echo "Bose patch stage is intentionally gated until exact smali entry points are verified."
          test -d patch
          test -f patch/README.md

      - name: Rebuild modded Melody
        run: java -jar apktool.jar b melody-decoded -o melody-bose-unsigned.apk

      - name: Install Android build tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.0.0'

      - name: Add Android build tools to PATH
        run: |
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/36.0.0"
          test -d "$BUILD_TOOLS_DIR"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"
          echo "Using apksigner at $BUILD_TOOLS_DIR/apksigner"

      - name: Create test signing key
        run: |
          keytool -genkeypair -v -keystore test-release.jks \
            -alias melody-test -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Melody Bose Native Mod, O=Local Test"

      - name: Sign modified APK
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks test-release.jks \
            --ks-pass pass:android --key-pass pass:android \
            --out melody-bose-native-mod.apk melody-bose-unsigned.apk
          "$APKSIGNER" verify --verbose melody-bose-native-mod.apk

      - name: Upload modified APK and decoded sources
        uses: actions/upload-artifact@v7
        with:
          name: melody-bose-native-mod
          path: |
            melody-bose-native-mod.apk
            melody-bose-unsigned.apk
            melody-analysis.txt
            melody-decoded/
